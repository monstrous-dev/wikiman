# Acceptance bar redefined: OKF wiki as a native LLM skill, 9/10 rubric on real transcripts

## Context

The prior gauntlet bar ([[gauntlet-bar-llm-memory-e2e]]) framed "done" as three quality pillars: LLM memory, self-learning, knows-when-to-use. The user then redefined the bar in behavioral terms: **the wiki operates in OKF, and using it must be a native skill of the LLM** — judged from real session transcripts, not from descriptions.

The assistant distilled this into a gauntlet prompt (gauntlet-loop method) for finishing wikiman at \`C:\\Users\\PTW\\.pi\\agent\\extensions\\wiki-context\` against the handover roadmap (\`C:\\Users\\PTW\\Desktop\\wikiman-improvement-handover.md\` + docs/wiki).

## The choice

**The bar**: a fresh-session transcript on a real project where —
1. The **operating contract, overview, and index are always in context** (instructions for how to operate the wiki present at all times);
2. **Where-is-X is answered from the map before any grep** (wayfinding/navigation as a native skill);
3. Concepts are **lazy-loaded one at a time** and the agent **progressively discloses only what the task needs**;
4. **Just-in-time instructions arrive exactly when relevant**.

**The protocol**: smallest judgeable pieces; builder + separate critic with fresh context; the critic runs real sessions, puts the transcript next to the bar blind, names the single biggest remaining gap, and loops back to the builder.

**The measurable half**: a 10-point rubric per session covering contract presence, map-first wayfinding, lazy-load discipline, progressive disclosure, and JIT timing. **9/10 or better wins**; praise is not useful — the critic is harsh. Builders and critics run as parallel subagents. A live progress page updates as work evolves.

## Alternatives considered

- Keep the prior three-pillar bar (memory / self-learning / knows-when-to-use). Superseded: pillars describe *outcomes*, but the new bar specifies *observable session behaviors* — contract presence, map-first lookup, lazy-load discipline, progressive disclosure, JIT timing — which a critic can score directly from a transcript.
- Score against a description of quality. Rejected: the bar is explicitly "compare transcripts against the bar itself, not against a description of it".

## Rationale

Behavioral criteria are judgeable from real transcripts; quality pillars are not. The redefinition keeps the gauntlet structure (real bar + separate critic + e2e runs) but makes the target concrete enough for a blind critic to grade.

## Consequences

- Supersedes the three-pillar formulation; all remaining roadmap work (F2 okf_version migrations, R2 session journal, R3 ranked token-budgeted injection, R4 git-aware injection, R5 ranked search, R6 dedupe/governors, R7 /wiki:digest /wiki:stats viewer search, R8 global memory tier, ask-first update check, e2e test suite) is now driven as gauntlet rounds against the native-skill rubric.
- R3/R5 (ranked, token-budgeted injection and search) directly serve contract-presence and progressive-disclosure criteria; R2 (session journal) serves JIT timing.
- Exit criterion for the whole project: a critic-scored 9/10 fresh-session transcript, not item counts on the roadmap.
`,

# Disconnect/reconnect state lives in agent home, keyed per cwd

## Context

User asked for a way to pause wikiman for a project **without deleting its \`docs/wiki/\` bundle** — "stop being proactive" had to be decoupled from "remove the wiki". Disconnect state needed a home, and the choice determines its semantics.

## Decision

Disconnect state lives in **agent home**: \`DISCONNECTED_FILE\` = \`~/.pi/agent/.wiki-disconnected.json\`, a flat JSON array of absolute cwd paths, loaded/saved via \`loadDisconnected\` / \`saveDisconnected\` / \`isDisconnected\` helpers. This mirrors the existing per-machine registries (\`.wiki-omitted.json\` for declined-init folders, \`.wiki-asked.json\` for ask-later state). Guards sit at all five proactive surfaces:

- \`before_agent_start\` — no context injection
- \`session_start\` — no staleness check / init-ask; footer shows \`wiki: disconnected\`
- \`agent_end\` — no recap spawn; pending debounced recap cancelled
- \`/wiki:update\`, \`/wiki:init\` — refuse with a reconnect hint

Still functional while disconnected: \`docs/wiki/\` bundle untouched on disk, \`/wiki\` viewer, and all \`wiki_get\` / \`wiki_search\` / \`wiki_related\` lookups. Both commands enforce the trust gate and refuse in git worktrees (dormancy rule).

## Alternatives considered

- **Repo-local marker** (e.g. \`docs/wiki/.disconnected\`) — would make disconnect survive sync across machines and be visible to collaborators. Offered to the user as a switch; rejected for now because disconnect is a *per-machine user preference* ("this machine finds this wiki noisy"), not a property of the project, and the bundle should stay pure project content.

## Rationale

Consistency with the two existing registries in agent home, and correct default semantics: reconnecting on another machine (fresh clone) should not inherit a muted wiki.

## Consequences

- Disconnect does **not** survive across machines — if cross-machine semantics are wanted later, migrate to a repo-local marker.
- The state file is keyed by absolute cwd; moving/renaming a project folder effectively disconnects the new path and orphans the old entry (harmless stale data).
- Implemented in \`index.ts\` (single source of truth); type-check verified 0 new errors (21 pre-existing before and after).

## Source

- \`index.ts\` — \`DISCONNECTED_FILE\`, \`loadDisconnected\` / \`saveDisconnected\` / \`isDisconnected\`, and the five guard sites

# Gauntlet acceptance bar: 9/10 LLM memory with self-learning, verified e2e

## Context

After the R1 + F1 + curator slice landed ([[recap-runs-in-process-not-via-agentman-subagent]], commit \`ec1034a\`), the roadmap status ([[handover-roadmap-slice-2]]) showed 4 of ~11 items done and named F2 + R2 as the next slice. The user then set an explicit, measurable acceptance bar for ALL remaining work, invoking the gauntlet-loop method:

> build all improvements and test the extension e2e until the wiki/extension is **9 out of 10 for LLM memory**, has **self-learning**, and **knows when to use** (records the right thing at the right moment).

## The choice

The remaining roadmap (F2 migration layer, R2 session journal, R3–R8) is no longer "ship slices and self-assess quality". Every improvement is driven as a gauntlet:

1. **Concrete bar** — quality is judged against a real, fetchable reference (a working wiki that demonstrably captures the right knowledge, verified e2e in a live session), not against a self-description of quality.
2. **Builder + separate critic** — the agent that builds a piece is not the one that judges it; the critic compares output blind against the bar and names the single biggest remaining gap.
3. **Loop until the bar is met** — exit is "critic picks ours" / the 9/10 bar demonstrably reached, never a round count or a "looks good to me".
4. **E2E verification is a hard gate** — per the house gotcha ([[new-commands-need-reload]]), static checks (tsc baseline diff) are necessary but not sufficient; features are only "done" after runtime verification in a fresh session.

## Alternatives considered

- **Continue ad-hoc slice-by-slice with self-assessed quality** (the previous mode). Rejected: self-assessment drifts upward; the existing roadmap learnings already flagged "pending runtime verification" items that nobody had actually run.
- **Define the bar as a rubric/scorecard doc only**. Rejected as insufficient alone: a rubric without a separate critic and e2e runs still lets the builder grade its own homework.

## Rationale

"9 out of 10 for LLM memory" only means something if some agent can actually observe the extension failing or succeeding at capturing the right knowledge in real sessions. The gauntlet structure (real bar + separate critic + e2e) is the only approach in play that produces that evidence.

## Consequences

# Recap runs in-process, not via agentman subagent

## Context

The end-of-turn recap originally spawned an agentman subagent (\`agents/wiki-recap.md\`
prompt). That made the flagship recap a silent no-op on fresh installs: without
agentman — or without the copied prompt in \`~/.pi/agent/agents/\` — no recap ever
ran. Handover item R1 called for inlining it.

## Choice

\`runInlineRecap()\` in \`index.ts\` replaces the subagent spawn:

- One \`modelRegistry.complete()\` call (hamster pattern), 45 s timeout, \`randomUUID\`
  sessionId, recap prompt shipped in-package.
- \`parseRecapNotes()\` extracts JSON fence/prose-tolerantly, drops unknown note types
  and empty fields, and **never trusts LLM-authored file paths**.
- Validated notes flow through the same \`noteInto\`/\`notePage\` funnel the
  \`wiki_note_*\` tools use — frontmatter, slug collisions, indexes, memory.md all
  handled identically.
- **Silent degradation** with no model/auth; 2-attempt error-adaptive retry;
  per-note try/catch so one bad note can't kill the batch.
- Debounce/suppress machinery untouched (handover requirement).

## Alternatives considered

- Keep the agentman subagent — rejected: hard dependency; fresh installs get
  nothing.
- Let the LLM write files directly from its reply — rejected: bypasses the
  frontmatter/slug/index/memory handling and trusts LLM-authored paths.

## Rationale

Self-contained means the wiki is self-maintaining on every install, not just ones
with agentman; one validated write funnel for everything entering \`docs/wiki/\`.

## Consequences (why the code looks this way)

- The debounced timer carries a \`.catch\` — a timer firing during session teardown
  must never crash the session (the session-kill gotcha).
- The model reference is captured **synchronously** in \`agent_end\` before the timer
  is scheduled — async context may be gone by the time it fires.
- Related slice change: \`spawnWikiAgent\` gained a \`fallbackSteer\` — \`/wiki:update\`
  and staleness prompts fall back to an **in-session update** with house rules
  baked into the steer prompt when agentman or the prompt copy is absent; the
  staleness delegation prompt adapts to delegate-tool absence. Same
  degrade-gracefully philosophy as the recap.

## Status

Accepted. Implemented in commit \`ec1034a\` (2026-11-16), on top of restore point
\`41d6d93\` / tag \`restore-pre-r1\`. Runtime testing still pending (fresh session or
\`/reload\`).

# Update propagation: okf_version-gated additive bundle migrations + prompt-in-package

## Context

Wikiman has three kinds of "instances" that must receive updates, each with a different propagation story:

- **A. Extension instances** (user machines) — today manual \`pi update git:github.com/monstrous-dev/wikiman\`. Plan: add \`CHANGELOG.md\` + semver git tags, plus an optional ask-first update check on \`session_start\` (throttled to once/24h, \`git ls-remote --tags\`, ~2s time-box, silent offline, notify only — never auto-install, because extensions load at session start and mid-session swaps are messy).
- **B. Wiki bundle instances** (every project's \`docs/wiki/\`) — the real gap. Bundles are user data scattered across repos; new extension versions add surfaces (\`memory.md\`, \`changelog/\`, future \`journal/\`, nav markers) that old bundles never receive.
- **C. Agent prompt instances** (\`wiki-recap\`/\`wiki-curator\` in \`~/.pi/agent/agents/\`) — manual copies that are never updated. Worst propagation story.

## The choice

For **B**: the extension declares a \`BUNDLE_VERSION\`; the bundle's \`okf_version\` frontmatter (currently stamped at scaffold, never read) becomes the instance's schema level (missing = \`"0.1"\` legacy). On \`session_start\` or \`/wiki:update\`, compare; if behind → **ask-first** migrate. Migrations are an ordered, idempotent, **additive-only** registry (\`MIGRATIONS: Array<{to, apply(cwd)}>\`) that creates missing dirs/files, injects nav markers if absent, regenerates only marker-delimited derived surfaces (nav map, memory.md), appends to \`log.md\`, bumps \`okf_version\`, calls \`wiki_mark_synced()\`. \`ensureBundle()\` (the fix for the re-init data-loss bug) **is migration step zero** — one code path handles both fresh init and old-bundle catch-up.

For **C**: remove the instance — inline prompts in-package (prompt-in-package), so they propagate automatically with every \`pi update\`. Recap: already planned (R1). Curator: either fully in-process (structured edits-plan JSON applied deterministically) or keep agent-home copies as an optional power-user path refreshed via \`/wiki:install-prompts\` with a versioned header.

## Alternatives considered

- Auto-install extension updates → rejected: mid-session code swaps are messy; ask-first only.
- Silent auto-migration of bundles → rejected: each repo's git history is the user's only backup; ask-first always.
- Keep shipping prompts as agent-home files with a refresh command → rejected as primary path (drift risk; users never refresh); kept only as optional power-user escape hatch.

## Rationale

- \`okf_version\` already exists in every bundle's frontmatter — using it as the schema level costs nothing and gives an exact migration boundary.
- Additive-only + idempotent migrations mean re-running is safe and user-authored content can never be destroyed (directly addresses the \`/wiki:init\` overwrite bug).
- One shared code path (\`ensureBundle\`) for init and migration avoids two divergent scaffolding implementations.

## Consequences

- The \`/wiki:init\` rewrite bug must be fixed first (\`initBundle\` → \`ensureBundle\`, every write \`existsSync\`-guarded, regenerate only the marker-delimited nav-map section).
- The migration layer is a prerequisite for R2 (journal) reaching existing bundles.
- First recommended slice: R1 (inline recap) + ensureBundle + curator prompt-inlining — shared machinery (in-process completion, prompt-in-package, deterministic writer) makes the extension genuinely self-contained.

# Wiki:init is ensure-semantics — never overwrites authored content

## Context

\`initBundle()\` (the \`/wiki:init\` handler) unconditionally rewrote \`index.md\`,
\`overview.md\`, \`log.md\`, \`last_updated.md\`, \`glossary.md\` and the \`pages/**\`
scaffolds — destroying authored content on an existing bundle (documented in
[[wiki-init-data-loss]]; only \`pages/\`
was guarded). The fix direction was pre-agreed in
[[update-propagation-okf-migrations]] as F1.

## Choice

Implemented as **ensure-semantics** (commit \`ec1034a\`):

- Every stub write goes through \`writeIfMissing\` (given a pass-through \`enc\` param
  so batched stub edits become unique prefix swaps).
- The auto-doc LLM pass (which rewrites overview etc.) runs **only on a fresh
  bundle** — its rewrites stay real writes there.
- \`last_updated.md\` is never reset by init.
- The confirm dialog now tells the truth about what init does on an existing bundle.

## Alternatives considered

- Keep destructive init behind louder warnings — rejected: data loss is
  unrecoverable and users don't read warnings.
- Extend the old per-file guard — rejected: guards rot; existence-based
  ensure-semantics cannot clobber by construction.

## Rationale

Init must be idempotent and safe to run anywhere: on an existing bundle it fills
gaps; on a fresh one it scaffolds and auto-docs. Re-running should never destroy.

## Status

Accepted, shipped. Note: the full \`ensureBundle()\` migration-step-zero unification
from the update-propagation decision (fresh init and old-bundle catch-up sharing
one code path, \`okf_version\`-gated migrations) is **still pending** — that's the F2
migration layer the R2 journal work will need.

# Glossary

| Term | Definition |
|------|------------|
| Wikiman | This extension — gives every pi project a living OKF knowledge wiki at \`docs/wiki/\`. |
| pi | The coding-agent harness this extension plugs into (\`pi install git:github.com/monstrous-dev/wikiman\`). |
| OKF | Open Knowledge Format — Markdown files with typed frontmatter, \`[[wikilinks]]\`, and auto-generated indexes; the wiki bundle's format. |
| Wiki bundle | The \`docs/wiki/\` folder: index, overview, glossary, learnings/rules/decisions/preferences/pages, file-tree, log, \`last_updated.md\`. |
| Memory digest | Recent decisions/rules/patterns (from \`memory.md\`) injected into every session's context alongside the nav map and overview. |
| Staleness check | Session-start comparison of code changes vs \`docs/wiki/last_updated.md\` (git-first, mtime fallback), honoring \`.wiki_ignore\` + built-in ignores; nudges ask-first. |
| \`.wiki_ignore\` | Project-root patterns excluded from staleness detection (wiki self-edits, build dirs, lock files). |
| Recap agent (\`wiki-recap\`) | End-of-turn background sub-agent that mines the turn transcript and records major decisions, rules, and learnings. |
| Curator agent (\`wiki-curator\`) | Sub-agent that syncs wiki concepts to changed code, classifying real vs ephemeral changes and validating OKF. |
| Sentinel | \`<!-- wiki-context:v1 -->\` marker ensuring wiki context is injected once per session (re-injected only after compaction/resume). |
| Worktree dormancy | Behavior where the extension reads but never writes inside git linked worktrees — the wiki lives in the main checkout. |
| Viewer | Self-contained \`wiki-viewer.html\` (generated by \`viewer.ts\`) that renders the whole bundle in a browser via a localhost server. |
| Agentman | Companion package (\`monstrous-dev/agentman\`) providing the sub-agent runner the recap/curator agents require. |

# Fixture DLQ is genuinely unwired; ground truth must bless code-truthful readings

The DLQ is PLANTED TRAP #3 in the e2e fixture and is genuinely unwired: \`services/worker/src/queues/dlq.ts\` creates the \`tasks-dlq\` queue and a 60s sweeper, but no producer ever calls \`dlq.add\` — BullMQ retries a job 3 times and then leaves it in the \`tasks\` queue's own failed set, so it never reaches \`tasks-dlq\`. An empty DLQ is the code-correct reading. The S6 agent's 'contrarian' claim that it was unwired was code-accurate, so the ground-truth rubric (tests/ground-truth.md) was corrected to bless code-accurate readings of planted traps rather than the fixture's original (wrong) expectation — contradicting ADR 2's prose is RIGHT when the code says otherwise.

# New pi extension commands need a fresh session or /reload; test in the TUI, not pi -p

Two gotchas when developing this pi extension (referenced as the "house gotcha" but never written down until now):

1. **New extension code only appears in sessions started after the change.** pi loads extensions at session start, so a command added mid-session (e.g. a new \`/wiki:disconnect\`) does not exist in the current session. Verify it with \`/reload\` or a fresh session.

2. **Test extension commands in the TUI, not via \`pi -p\` from Git Bash.** Slash commands and session-start machinery (injection, staleness footer, recap) only exercise correctly in an interactive TUI session.

Observed 2026-11-16 while adding \`/wiki:disconnect\` / \`/wiki:reconnect\` — new commands were invisible to the session that implemented them.

# okf_version frontmatter is stamped at scaffold but never consumed

\`indexFrontmatter()\` stamps \`okf_version: "0.1"\` into a bundle's root \`index.md\` at scaffold time (index.ts ~line 1232), but **nothing ever reads it** — there is no version check and no migration path. New extension versions can add bundle surfaces (e.g. \`memory.md\`, \`changelog/\`, nav markers) that pre-existing bundles never receive, silently.

This unused field is the natural hook for bundle update propagation: the extension declares a \`BUNDLE_VERSION\`, the bundle's \`okf_version\` frontmatter records the instance's current schema level (missing = \`"0.1"\` legacy), and a comparison drives ask-first additive migrations. See the update-propagation decision.

## Source

- \`index.ts\` — \`indexFrontmatter()\` (~line 1232): sole writer of \`okf_version\`; no consumer anywhere

# /wiki:init re-init data loss (F1) — FIXED via ensure-semantics init

**RESOLVED (2026-11-16, handover item F1):** \`initBundle\` is now ensure-semantics — every scaffold write is guarded ("writeIfMissing"), only missing surfaces are added, authored overview/glossary/concept files survive a re-init, and \`last_updated.md\` is never reset. Re-running \`/wiki:init\` on a hand-written bundle is now safe. The analysis below is kept for context; do **not** treat this as an open gotcha anymore.

Original finding (pre-fix): \`initBundle()\` (\`/wiki:init\` handler) unconditionally \`writeFile\`'d \`index.md\`, \`overview.md\`, \`log.md\`, \`last_updated.md\`, \`glossary.md\`, and the \`pages/**/index.md\` scaffolds. Only \`.wiki_ignore\` was guarded by \`existsSync\`. The confirm dialog promised "will not overwrite existing concept files" — that was true **only for \`pages/\`\`; any authored overview/glossary content was wiped by a re-init.

The fix followed the direction agreed in the update-propagation decision: turn \`initBundle\` into an **ensureBundle**-style pass — every write guarded by \`existsSync\`, only *add missing surfaces*, regenerate only the auto-managed nav-map section between markers. \`ensureBundle()\` semantics double as migration step zero (fresh init and old-bundle catch-up share one code path) — the foundation F2's \`okf_version\` migration layer (see [[okf-version-never-checked]] and [[migrations-additive-ask-first]]) builds on.

## Source

- \`index.ts\` — \`initBundle()\` ensure-semantics rewrite (\`writeIfMissing\` helper, \`hadAuthored\` gates the auto-doc LLM pass)

# Wiki sync triggers: command vs staleness check vs version flows

Three independent wiki triggers exist: \`/wiki:update\` (on-demand full sync), a session-start staleness check keyed to *code* changes vs \`docs/wiki/last_updated.md\` (not version, with 1h ask cooldown), and version flows limited to the once-per-\`okf_version\` F2 schema migration and a daily wikiman update notify. Wiki content never auto-updates on version bump; the staleness prompt is only a nudge — declining just cools down and the stale footer dot persists. \`wiki_mark_synced\` stamps the wiki current after manual edits. The daily update-available notification points at \`/wiki:self-update\` (or the manual \`pi update git:github.com/monstrous-dev/wikiman\` CLI).

# Windows cmd.exe: use double quotes, not single

cmd.exe does not honor single quotes — shell commands in the harness (e.g. git commit messages) must use double quotes on Windows. Because \`spawnSync\` with \`shell: true\` joins argv raw, \`tests/run-probe.mjs\` wraps its \`pi -p\` prompt in double quotes and escapes any embedded \`"\` as \`''\` (cmd.exe's doubling escape) so multi-sentence prompts survive.

type: System Overview

description: What this project contains and its structure.
timestamp: "2026-11-16T08:40:12.625Z"

# Overview

This repository is **Wikiman** — a [pi](https://pi.dev) extension package
(\`monstrous-dev/wikiman\`, MIT) that gives every project a **living knowledge
wiki**: an OKF (Open Knowledge Format) bundle at \`docs/wiki/\` that the agent
consults before it greps and writes to as it learns. Each pi session starts
with the wiki's navigation map, overview, and a memory digest (recent
decisions, rules, patterns) injected into context, so the agent reads the map
before searching the codebase. Initialization is ask-first, declined folders
are remembered in \`~/.pi/agent/.wiki-omitted.json\`, and the extension stays
dormant inside git worktrees.

The implementation is deliberately minimal: two TypeScript files. \`index.ts\`
is the entire extension and the single source of truth ("no abstractions, one
file") — it provides session-start context injection, the lazy-load lookup
tools (\`wiki_get\` / \`wiki_search\` / \`wiki_related\` / \`wiki_discover\`), the
structured recording tools (\`wiki_note_learning\` / \`_rule\` / \`_decision\` /
\`_preference\` / \`_page\`), hygiene tools (\`wiki_validate\`, \`wiki_timestamp\`,
\`wiki_changelog\`, \`wiki_mark_synced\`), staleness detection comparing code
changes against \`docs/wiki/last_updated.md\` (git-first, mtime fallback,
respecting \`.wiki_ignore\` plus built-in framework ignores), and six commands:
\`/wiki\` (viewer), \`/wiki:update\`, \`/wiki:init\`, \`/wiki:self-update\`
(ask-first in-app extension update via \`pi update\`, then a \`/reload\`
reminder; the update-available notification points here), plus
\`/wiki:disconnect\` / \`/wiki:reconnect\` — pausing the extension's proactive machinery (injection,
staleness, recap, curator) for a folder without deleting its \`docs/wiki/\`
bundle (state in \`~/.pi/agent/.wiki-disconnected.json\`). \`viewer.ts\` is a
standalone module that generates a self-contained HTML viewer for the whole
bundle (\`wiki-viewer.html\` / \`wiki.js\` data) and serves it on localhost,
with client-side page filtering (a sidebar search box narrows the tree).
Releases are git tags documented in \`CHANGELOG.md\` (pin one with
\`pi install git:github.com/monstrous-dev/wikiman@vX.Y.Z\`), and \`tests/\`
holds the e2e gauntlet harness: \`run-probe.mjs\` (headless probe runner with
per-run debug-log hygiene and cmd.exe-safe prompt quoting),
\`ground-truth.md\`, \`rubric.md\`, and the \`fixture/\` generator that builds
the acme-ops fixture.

Supporting assets ship alongside the code: the end-of-turn **recap is
self-contained** — one in-process completion call (hamster-pattern
\`modelRegistry.complete\`, JSON-out → deterministic writes through the same
\`noteInto\`/\`notePage\` funnel the \`wiki_note_*\` tools use, retry-on-unparseable,
silent degradation without model/auth). \`agents/\` keeps the optional
\`wiki-curator\` prompt (used by \`/wiki:update\` and the staleness prompt; without
agentman or the copied prompt, the session LLM performs the sync itself), and
\`agents/wiki-recap.md\` remains as a legacy copy. \`skills/wikiman/SKILL.md\`
teaches the LLM the wiki-first lookup order and the recording taxonomy.

Finally, the extension dogfoods its own product: \`docs/wiki/\` here is the
project's own OKF bundle (scaffolded 2026-11-16 with index, overview,
glossary, file-tree, log, and page templates). State lives in the project —
\`.wiki_ignore\` excludes wiki edits and build output from staleness counts —
and \`readme.html\` is a dev-local artifact kept out of the package.

# Inline Recap Pipeline

The end-of-turn recap subsystem of \`index.ts\`: after each coding turn, one
in-process LLM completion mines the transcript and writes decisions, rules,
learnings, preferences, and pages into \`docs/wiki/\` — with no subagent and no
agentman dependency.

## Why it matters

It makes the wiki self-maintaining on every install (fresh installs included) and
guarantees every LLM-proposed wiki write goes through the same validated funnel as
the \`wiki_note_*\` tools — nothing the model says reaches disk unchecked.

## Details

- **Location**: \`index.ts\` — \`runInlineRecap()\` (scheduled debounced off
  \`agent_end\`), \`parseRecapNotes()\` (fence/prose-tolerant JSON extraction), recap
  prompt shipped in-package.
- **Interface**: input = the turn transcript; output = a validated note list fed to
  \`noteInto\`/\`notePage\` (the same funnel as \`wiki_note_*\`). 45 s timeout,
  \`randomUUID\` sessionId, 2-attempt error-adaptive retry, per-note try/catch.
- **Failure behavior**: silent degradation with no model/auth; \`.catch\` on the
  debounced timer (session-teardown safety); model captured synchronously in
  \`agent_end\` before the timer.
- **Configuration**: debounce/suppress machinery unchanged from the handover;
  \`/wiki:disconnect\` pauses it per folder.

## Relationships

- [recap-runs-in-process-not-via-agentman-subagent](../../decisions/recap-runs-in-process-not-via-agentman-subagent.md) — the decision behind it:
  why in-process, alternatives rejected
- \`noteInto\`/\`notePage\` — the only write path; identical handling to the
  \`wiki_note_*\` tools
- [wiki-init-ensure-semantics](../../decisions/wiki-init-ensure-semantics.md) — sibling
  safety change in the same slice (commit \`ec1034a\`)

## Lifecycle

- First added: 2026-11-16, commit \`ec1034a\` — replaced the agentman subagent
  spawn (\`agents/wiki-recap.md\` remains as a legacy copy).
- Significant changes: runtime testing pending (fresh session or \`/reload\`).

# Bundle migrations are additive-only, idempotent, and always ask-first

**Guideline**: Any new docs/wiki/ bundle surface or feature must ship as an **additive-only, idempotent migration step** keyed on a bump of the bundle's \`okf_version\` — never as a change that rewrites existing files.

**When it applies**: every wikiman change that adds or alters what a project's \`docs/wiki/\` bundle should contain (new files like \`journal/\`, new marker-delimited sections, new index links, frontmatter fields).

**Rules**:

- Create missing dirs/files; **never overwrite user-authored content** — regenerate only derived, marker-delimited sections (nav map between \`wiki-nav:start/end\`, memory digest between \`wiki-memory:start/end\`).
- Idempotent: re-running a migration step must be a no-op (\`existsSync\` guards before every write).
- **Ask-first**: confirm with the user before migrating a bundle — each repo's git history is the user's only backup.
- Implement migrations as an ordered registry (\`MIGRATIONS: Array<{to, apply(cwd)}>\`) applied via the shared \`ensureBundle()\` path (migration step zero = fresh init), never a second divergent scaffold implementation.
- After migrating: append to \`log.md\`, bump \`okf_version\`, call \`wiki_mark_synced()\`.

**Rationale**: bundles are user data scattered across many repos; extension updates must reach them without data loss (evidence: the \`/wiki:init\` re-init overwrite bug — see learnings).
