# Disconnect/reconnect state lives in agent home, keyed per cwd

## Context

User asked for a way to pause wikiman for a project **without deleting its \`docs/wiki/\` bundle** — "stop being proactive" had to be decoupled from "remove the wiki". Disconnect state needed a home, and the choice determines its semantics.

## Decision

Disconnect state lives in **agent home**: \`DISCONNECTED_FILE\` = \`~/.pi/agent/.wiki-disconnected.json\`, a flat JSON array of absolute cwd paths, loaded/saved via \`loadDisconnected\` / \`saveDisconnected\` / \`isDisconnected\` helpers. This mirrors the existing per-machine registries (\`.wiki-omitted.json\` for declined-init folders, \`.wiki-asked.json\` for ask-later state). Guards sit at all five proactive surfaces:

- \`before_agent_start\` — no context injection
- \`session_start\` — no staleness check / init-ask; footer shows \`wiki: disconnected\`
- \`agent_end\` — no recap spawn; pending debounced recap cancelled
- \`/wiki:update\`, \`/wiki:init\` — refuse with a reconnect hint

Still functional while disconnected: \`docs/wiki/\` bundle untouched on disk, \`/wiki\` viewer, and all \`wiki_get\` / \`wiki_search\` / \`wiki_related\` lookups. Both commands enforce the trust gate and refuse in git worktrees (dormancy rule).

## Alternatives considered

- **Repo-local marker** (e.g. \`docs/wiki/.disconnected\`) — would make disconnect survive sync across machines and be visible to collaborators. Offered to the user as a switch; rejected for now because disconnect is a *per-machine user preference* ("this machine finds this wiki noisy"), not a property of the project, and the bundle should stay pure project content.

## Rationale

Consistency with the two existing registries in agent home, and correct default semantics: reconnecting on another machine (fresh clone) should not inherit a muted wiki.

## Consequences

- Disconnect does **not** survive across machines — if cross-machine semantics are wanted later, migrate to a repo-local marker.
- The state file is keyed by absolute cwd; moving/renaming a project folder effectively disconnects the new path and orphans the old entry (harmless stale data).
- Implemented in \`index.ts\` (single source of truth); type-check verified 0 new errors (21 pre-existing before and after).

## Source

- \`index.ts\` — \`DISCONNECTED_FILE\`, \`loadDisconnected\` / \`saveDisconnected\` / \`isDisconnected\`, and the five guard sites

# Update propagation: okf_version-gated additive bundle migrations + prompt-in-package

## Context

Wikiman has three kinds of "instances" that must receive updates, each with a different propagation story:

- **A. Extension instances** (user machines) — today manual \`pi update git:github.com/monstrous-dev/wikiman\`. Plan: add \`CHANGELOG.md\` + semver git tags, plus an optional ask-first update check on \`session_start\` (throttled to once/24h, \`git ls-remote --tags\`, ~2s time-box, silent offline, notify only — never auto-install, because extensions load at session start and mid-session swaps are messy).
- **B. Wiki bundle instances** (every project's \`docs/wiki/\`) — the real gap. Bundles are user data scattered across repos; new extension versions add surfaces (\`memory.md\`, \`changelog/\`, future \`journal/\`, nav markers) that old bundles never receive.
- **C. Agent prompt instances** (\`wiki-recap\`/\`wiki-curator\` in \`~/.pi/agent/agents/\`) — manual copies that are never updated. Worst propagation story.

## The choice

For **B**: the extension declares a \`BUNDLE_VERSION\`; the bundle's \`okf_version\` frontmatter (currently stamped at scaffold, never read) becomes the instance's schema level (missing = \`"0.1"\` legacy). On \`session_start\` or \`/wiki:update\`, compare; if behind → **ask-first** migrate. Migrations are an ordered, idempotent, **additive-only** registry (\`MIGRATIONS: Array<{to, apply(cwd)}>\`) that creates missing dirs/files, injects nav markers if absent, regenerates only marker-delimited derived surfaces (nav map, memory.md), appends to \`log.md\`, bumps \`okf_version\`, calls \`wiki_mark_synced()\`. \`ensureBundle()\` (the fix for the re-init data-loss bug) **is migration step zero** — one code path handles both fresh init and old-bundle catch-up.

For **C**: remove the instance — inline prompts in-package (prompt-in-package), so they propagate automatically with every \`pi update\`. Recap: already planned (R1). Curator: either fully in-process (structured edits-plan JSON applied deterministically) or keep agent-home copies as an optional power-user path refreshed via \`/wiki:install-prompts\` with a versioned header.

## Alternatives considered

- Auto-install extension updates → rejected: mid-session code swaps are messy; ask-first only.
- Silent auto-migration of bundles → rejected: each repo's git history is the user's only backup; ask-first always.
- Keep shipping prompts as agent-home files with a refresh command → rejected as primary path (drift risk; users never refresh); kept only as optional power-user escape hatch.

## Rationale

- \`okf_version\` already exists in every bundle's frontmatter — using it as the schema level costs nothing and gives an exact migration boundary.
- Additive-only + idempotent migrations mean re-running is safe and user-authored content can never be destroyed (directly addresses the \`/wiki:init\` overwrite bug).
- One shared code path (\`ensureBundle\`) for init and migration avoids two divergent scaffolding implementations.

## Consequences

- The \`/wiki:init\` rewrite bug must be fixed first (\`initBundle\` → \`ensureBundle\`, every write \`existsSync\`-guarded, regenerate only the marker-delimited nav-map section).
- The migration layer is a prerequisite for R2 (journal) reaching existing bundles.
- First recommended slice: R1 (inline recap) + ensureBundle + curator prompt-inlining — shared machinery (in-process completion, prompt-in-package, deterministic writer) makes the extension genuinely self-contained.

| Term | Definition |

# New pi extension commands need a fresh session or /reload; test in the TUI, not pi -p

Two gotchas when developing this pi extension (referenced as the "house gotcha" but never written down until now):

1. **New extension code only appears in sessions started after the change.** pi loads extensions at session start, so a command added mid-session (e.g. a new \`/wiki:disconnect\`) does not exist in the current session. Verify it with \`/reload\` or a fresh session.

2. **Test extension commands in the TUI, not via \`pi -p\` from Git Bash.** Slash commands and session-start machinery (injection, staleness footer, recap) only exercise correctly in an interactive TUI session.

Observed 2026-11-16 while adding \`/wiki:disconnect\` / \`/wiki:reconnect\` — new commands were invisible to the session that implemented them.

# okf_version frontmatter is stamped at scaffold but never consumed

\`indexFrontmatter()\` stamps \`okf_version: "0.1"\` into a bundle's root \`index.md\` at scaffold time (index.ts ~line 1232), but **nothing ever reads it** — there is no version check and no migration path. New extension versions can add bundle surfaces (e.g. \`memory.md\`, \`changelog/\`, nav markers) that pre-existing bundles never receive, silently.

This unused field is the natural hook for bundle update propagation: the extension declares a \`BUNDLE_VERSION\`, the bundle's \`okf_version\` frontmatter records the instance's current schema level (missing = \`"0.1"\` legacy), and a comparison drives ask-first additive migrations. See the update-propagation decision.

## Source

- \`index.ts\` — \`indexFrontmatter()\` (~line 1232): sole writer of \`okf_version\`; no consumer anywhere

# /wiki:init on an existing bundle destroys authored content (only pages/ is guarded)

\`initBundle()\` (index.ts, \`/wiki:init\` handler) unconditionally \`writeFile\`s \`index.md\`, \`overview.md\`, \`log.md\`, \`last_updated.md\`, \`glossary.md\`, and the \`pages/**/index.md\` scaffolds. Only \`.wiki_ignore\` is guarded by \`existsSync\`. The confirm dialog promises "will not overwrite existing concept files" — that is true **only for \`pages/\`**; any authored overview/glossary content is wiped by a re-init. Data-loss gotcha: never re-run \`/wiki:init\` on a bundle with hand-written content until this is fixed.

Fix direction (agreed in the update-propagation decision): turn \`initBundle\` into **\`ensureBundle()\`** — every write guarded by \`existsSync\`, only *add missing surfaces*, regenerate only the auto-managed nav-map section between markers. \`ensureBundle()\` doubles as migration step zero (fresh init and old-bundle catch-up share one code path).

## Source

- \`index.ts\` — \`initBundle()\` (~line 1047): unguarded writes to index/overview/log/last_updated/glossary

type: System Overview

description: What this project contains and its structure.
timestamp: "2026-11-16T08:40:12.625Z"

# Overview

This repository is **Wikiman** — a [pi](https://pi.dev) extension package
(\`monstrous-dev/wikiman\`, MIT) that gives every project a **living knowledge
wiki**: an OKF (Open Knowledge Format) bundle at \`docs/wiki/\` that the agent
consults before it greps and writes to as it learns. Each pi session starts
with the wiki's navigation map, overview, and a memory digest (recent
decisions, rules, patterns) injected into context, so the agent reads the map
before searching the codebase. Initialization is ask-first, declined folders
are remembered in \`~/.pi/agent/.wiki-omitted.json\`, and the extension stays
dormant inside git worktrees.

The implementation is deliberately minimal: two TypeScript files. \`index.ts\`
is the entire extension and the single source of truth ("no abstractions, one
file") — it provides session-start context injection, the lazy-load lookup
tools (\`wiki_get\` / \`wiki_search\` / \`wiki_related\` / \`wiki_discover\`), the
structured recording tools (\`wiki_note_learning\` / \`_rule\` / \`_decision\` /
\`_preference\` / \`_page\`), hygiene tools (\`wiki_validate\`, \`wiki_timestamp\`,
\`wiki_changelog\`, \`wiki_mark_synced\`), staleness detection comparing code
changes against \`docs/wiki/last_updated.md\` (git-first, mtime fallback,
respecting \`.wiki_ignore\` plus built-in framework ignores), and five commands:
\`/wiki\` (viewer), \`/wiki:update\`, \`/wiki:init\`, plus \`/wiki:disconnect\` /
\`/wiki:reconnect\` — pausing the extension's proactive machinery (injection,
staleness, recap, curator) for a folder without deleting its \`docs/wiki/\`
bundle (state in \`~/.pi/agent/.wiki-disconnected.json\`). \`viewer.ts\` is a
standalone module that generates a self-contained HTML viewer for the whole
bundle (\`wiki-viewer.html\` / \`wiki.js\` data) and serves it on localhost.

Supporting assets ship alongside the code: the end-of-turn **recap is
self-contained** — one in-process completion call (hamster-pattern
\`modelRegistry.complete\`, JSON-out → deterministic writes through the same
\`noteInto\`/\`notePage\` funnel the \`wiki_note_*\` tools use, retry-on-unparseable,
silent degradation without model/auth). \`agents/\` keeps the optional
\`wiki-curator\` prompt (used by \`/wiki:update\` and the staleness prompt; without
agentman or the copied prompt, the session LLM performs the sync itself), and
\`agents/wiki-recap.md\` remains as a legacy copy. \`skills/wikiman/SKILL.md\`
teaches the LLM the wiki-first lookup order and the recording taxonomy.

Finally, the extension dogfoods its own product: \`docs/wiki/\` here is the
project's own OKF bundle (scaffolded 2026-11-16 with index, overview,
glossary, file-tree, log, and page templates). State lives in the project —
\`.wiki_ignore\` excludes wiki edits and build output from staleness counts —
and \`readme.html\` is a dev-local artifact kept out of the package.

# Bundle migrations are additive-only, idempotent, and always ask-first

**Guideline**: Any new docs/wiki/ bundle surface or feature must ship as an **additive-only, idempotent migration step** keyed on a bump of the bundle's \`okf_version\` — never as a change that rewrites existing files.

**When it applies**: every wikiman change that adds or alters what a project's \`docs/wiki/\` bundle should contain (new files like \`journal/\`, new marker-delimited sections, new index links, frontmatter fields).

**Rules**:

- Create missing dirs/files; **never overwrite user-authored content** — regenerate only derived, marker-delimited sections (nav map between \`wiki-nav:start/end\`, memory digest between \`wiki-memory:start/end\`).
- Idempotent: re-running a migration step must be a no-op (\`existsSync\` guards before every write).
- **Ask-first**: confirm with the user before migrating a bundle — each repo's git history is the user's only backup.
- Implement migrations as an ordered registry (\`MIGRATIONS: Array<{to, apply(cwd)}>\`) applied via the shared \`ensureBundle()\` path (migration step zero = fresh init), never a second divergent scaffold implementation.
- After migrating: append to \`log.md\`, bump \`okf_version\`, call \`wiki_mark_synced()\`.

**Rationale**: bundles are user data scattered across many repos; extension updates must reach them without data loss (evidence: the \`/wiki:init\` re-init overwrite bug — see learnings).
